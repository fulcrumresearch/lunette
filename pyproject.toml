[project]
name = "lunette"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai",
    "inspect-evals[swe-bench]",
    "openai>=2.6.1",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["lunette*"]

[tool.uv.sources]
inspect-evals = { git = "https://github.com/UKGovernmentBEIS/inspect_evals.git" }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[project.entry-points."inspect_ai"]
lunette = "lunette._registry"

site_name: Lunette
site_description: Platform for understanding agents and evals through investigator agents
site_url: https://docs.fulcrumresearch.ai
repo_url: https://github.com/fulcrumresearch/lunette
repo_name: fulcrumresearch/lunette

theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [., docs]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: google

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tracing: tracing.md
  - Running Agents: running-agents.md
  - Investigating: investigating/index.md
  - API Reference:
      - Overview: api/index.md
      - Client: api/client.md
      - Tracer: api/tracer.md
      - Sandbox: api/sandbox.md
      - Trajectory: api/trajectory.md


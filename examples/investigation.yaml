name: task_underspecification_investigation
kind: issue_detection
trajectory_filters:
  filters:
    score: [lt, 0.5]
agent:
  name: underspecification_analyzer
  prompt: |
      Analyze failed trajectories for task underspecification issues.

      Look for cases where:
      - The task description is vague or ambiguous
      - The tests are checking for specific behaviors not mentioned in the task description
      - The agent implemented a reasonable solution that doesn't match hidden test requirements
      - Edge cases are tested but not documented in the task specification
      - The task description and test suite have a mismatch in scope or detail

      For each instance found, report:
      1. What the task description specified
      2. What the tests actually required
      3. The gap between task description and test expectations
      4. Evidence from the trajectory showing the agent followed the task description correctly
